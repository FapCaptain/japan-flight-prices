name: Daily flight prices

on:
  schedule:
    # 16:47 UTC = 2:47am Brisbane. GitHub usually starts scheduled runs 3 to 4.5 hours late,
    # so this lands roughly 6 to 7:30am, ahead of the 9:38am Claude task
    - cron: "47 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch Google Flights prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "flight-price-bot"
          git config user.email "flight-price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Prices for $(TZ=Australia/Brisbane date +%F)"
          git push
