name: Daily flight prices

on:
  # Manual runs only. The daily fetch now runs on a home PC at 7:30am via Task Scheduler
  # (run_fetch.ps1), so there is no schedule here and SerpApi credits are only spent once a day.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch Google Flights prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "flight-price-bot"
          git config user.email "flight-price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Prices for $(TZ=Australia/Brisbane date +%F)"
          git push
