name: Daily flight prices

on:
  schedule:
    # 18:47 UTC = 4:47am Brisbane, well before the 6:38am Claude task
    # (GitHub's scheduled runs can be delayed by up to an hour or so)
    - cron: "47 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Google Flights prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_flights.py

      - name: Commit results
        run: |
          git config user.name "flight-price-bot"
          git config user.email "flight-price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Prices for $(TZ=Australia/Brisbane date +%F)"
          git push
